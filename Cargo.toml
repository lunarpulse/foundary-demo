[package]
name = "foundary-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = "1.0.193"
serde_json = "1.0.108"
anyhow = "1.0.75"
thiserror = "1.0.50"
tokio = { version = "1.35.0", features = ["full"] }
tracing = "0.1.40"
clap = { version = "4.4.11", features = ["derive"] }
rand = "0.8.5"
regex = "1.10.2"
uuid = { version = "1.6.1", features = ["v4"] }
chrono = "0.4.31"
log = "0.4.20"
env_logger = "0.10.1"
walkdir = "2.4.0"
rayon = "1.12.0"
itertools = "0.12.0"
bytes = "1.5.0"
futures = "0.3.29"
base64 = "0.21.5"
sha2 = "0.10.8"
