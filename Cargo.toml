[package]
name = "foundary-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
# deps are separated by comment lines so concurrent single-bump PRs each
# touch an isolated hunk (M0 gate run-2 lesson: adjacent-line edits conflict)
serde = "1.0.229"

serde_json = "1.0.108"

anyhow = "1.0.104"

thiserror = "2.0.21"

tokio = { version = "1.53.2", features = ["full"] }

tracing = "0.1.44"

clap = { version = "4.6.7", features = ["derive"] }

rand = "0.10.3"

regex = "1.13.1"

uuid = { version = "1.27.0", features = ["v4"] }

chrono = "0.4.45"

log = "0.4.34"

env_logger = "0.10.1"

walkdir = "2.4.0"

rayon = "1.12.0"

itertools = "0.15.0"

bytes = "1.12.1"

futures = "0.3.34"

base64 = "0.23.1"

sha2 = "0.11.0"
